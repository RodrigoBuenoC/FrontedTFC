<h1 class="text-center text-warning display-4 neon-text mt-4">🎰 Juegos 🎰</h1>
<hr class="neon-hr">

<!-- Puntos del usuario estilo casino -->
<div *ngIf="isAuthenticated()" class="casino-points-tab">
  <div class="casino-display">
    <i class="bi bi-coin gold-icon"></i>
    <span class="points-text">Mis puntos: {{ puntos }}</span>
  </div>
</div>



<!-- Sección de juego destacado -->
<div class="container mb-5">
  <div class="card bg-dark text-light neon-card p-4">
    <h2 class="text-warning"><i class="bi bi-star-fill"></i> Juego Destacado</h2>
    <div class="row align-items-center">
      <div class="col-md-6">
        <h3 class="neon-text">⚽ Penalty Challenge</h3>
        <p>¡Prueba tu puntería en el clásico juego de penales y gana premios!</p>

        <!-- Botón condicionado a autenticación -->
        <div *ngIf="isAuthenticated(); else elseBlockDestacado">
          <button class="btn btn-neon mt-2" [routerLink]="['/juegos', '1']">
            <i class="bi bi-play-circle"></i> Jugar ahora
          </button>
        </div>
        <ng-template #elseBlockDestacado>
          <button class="btn btn-danger mt-2" [routerLink]="['/login']">
            <i class="bi bi-box-arrow-in-right"></i> Inicia sesión para jugar
          </button>
        </ng-template>
      </div>

      <div class="col-md-6 text-center">
        <img src="/assets/porteroo-removebg-preview.png" alt="Penalty" class="img-fluid rounded shadow-lg" />
      </div>
    </div>
  </div>
</div>


<!-- Sección de todos los juegos -->
<div class="container">
  <h3 class="text-light mb-3">🎮 Todos los Juegos</h3>
  <div class="row">
    <div class="col-lg-4 col-md-6 mb-4" *ngFor="let juego of juegos">
      <div class="card neon-card text-center p-3">
        <div class="card-body">
          <h4 class="fw-bold neon-text mb-2">
            <i class="bi bi-controller"></i> {{ juego.name }}
          </h4>
        

          <div class="d-flex justify-content-center gap-2 mt-3">
            <button *ngIf="isAuthenticated(); else elseBlock" class="btn btn-neon px-4"
              [routerLink]="['/juegos', juego.id]">
              <i class="bi bi-cash-coin"></i> Jugar
            </button>
            <button *ngIf="isAuthenticated() && isAdmin()" class="btn btn-outline-neon"
              (click)="seleccionarJuego(juego)">
              <i class="bi bi-pencil"></i> Editar
            </button>
          </div>

          <ng-template #elseBlock>
            <button class="btn btn-danger mt-2" [routerLink]="['/login']">
              <i class="bi bi-box-arrow-in-right"></i> Inicia sesión
            </button>
          </ng-template>
        </div>
      </div>
    </div>
  </div>
</div>
