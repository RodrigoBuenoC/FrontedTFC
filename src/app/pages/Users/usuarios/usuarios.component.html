<h1 class="text-center text-warning display-4 neon-text mt-4">👤 Usuarios</h1>
<hr class="neon-hr">

<!-- Campo de búsqueda con efecto neón -->
<div class="input-group mb-3 neon-input-container">
  <input 
    type="text" 
    class="form-control neon-input" 
    placeholder="🔍 Buscar usuario por nombre..." 
    [(ngModel)]="filtroNombre" 
    (input)="filtrarUsuarios()">
</div>



  
  <div class="row justify-content-center">
    <div class="col-lg-4 col-md-6 mb-4" *ngFor="let usuario of usuariosFiltrados">
      
      <div class="card neon-card text-center usuario-card">
        
        <!-- Header con ID -->
        <div class="card-header">
          <span class="badge bg-dark text-light">ID: {{ usuario.id }}</span>
        </div>

        <!-- Cuerpo de la tarjeta -->
        <div class="card-body">
          <h3 class="fw-bold neon-text"><i class="bi bi-person-circle"></i> {{ usuario.name }}</h3>
          <p><i class="bi bi-envelope"></i> <strong> {{ usuario.email }}</strong></p>
          <p class="fw-bold text-warning"><i class="bi bi-star-fill"></i> Puntos: {{ usuario.puntos }}</p>

          <!-- Botones de acción -->
          <div class="d-flex justify-content-center mt-3">
            <button class="btn btn-neon me-2" [routerLink]="['/usuarios', usuario.id]">
              <i class="bi bi-eye"></i> Ver perfil
            </button>          
          </div>
        </div>

      </div>
    </div>
  </div>


  <!-- Paginación Mejorada -->
  <div class="d-flex justify-content-center mt-4 gap-4">
    <button class="btn btn-neon me-2" (click)="prevPage()" [disabled]="currentPage === 1">Anterior</button>
   <br>
    <button class="btn btn-neon me-2" (click)="nextPage()" [disabled]="!hasMoreUsers">Siguiente</button>
  </div>

  <div class="text-center mt-3">
  
    <span class="fw-bold fs-4 neon-text">Página {{ currentPage }}</span>
  </div>
