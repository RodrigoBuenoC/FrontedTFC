<h2 class="text-center text-primary mt-4">Sesion de juego</h2>

<!-- Loader mientras se obtiene la información -->
<div class="d-flex justify-content-center align-items-center vh-50" *ngIf="!sesion; else divSesion">
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
        <span class="visually-hidden"></span>
    </div>
</div>

<!-- Información del usuario -->
<ng-template #divSesion>
    <hr>
    <div class="container d-flex justify-content-center">
        <div class="card shadow-lg border-0 rounded-4 p-4" style="max-width: 500px;">
            
            <div class="card-header bg-dark text-white text-center fw-bold">
                <i class="bi bi-person-circle"></i> Información de la sesion
            </div>

            <div class="card-body text-center">
                <p class="text-muted"><strong>ID:</strong> {{sesion.id}}</p>
                <h2 class="text-primary fw-bold"><i class="bi bi-person"></i><strong>user_id</strong>{{sesion.user_id}}</h2>
                <p class="text-muted"><i class="bi bi-envelope"></i> <strong>game_id:</strong> {{sesion.game_id}}</p>
                <p class="text-success fw-bold"><i class="bi bi-star-fill"></i> Puntos: {{sesion.puntos_ganados}}</p>

                <button class="btn btn-danger mt-3" routerLink="/sesiones">
                    <i class="bi bi-arrow-left"></i> Regresar
                </button>
            </div>

        </div>
    </div>
</ng-template>
