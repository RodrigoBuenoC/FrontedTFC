<h2 class="text-center text-warning neon-text mt-4">🎮 Historial de Sesiones</h2>
<hr class="neon-hr">

<div class="container">
  <table class="table mt-3 text-dark">
    <thead class="bg-warning text-dark neon-table-header">
      <tr>
        <th>ID</th>
        <th>Usuario</th>
        <th>Juego</th>
        <th>Puntos Ganados</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let sesion of sesiones" class="neon-table-row">
        <td class="text-light fw-bold">{{ sesion.id }}</td>
        <td class="text-warning fw-bold">{{ getNombreUsuario(sesion.user_id) }}</td>
        <td class="text-success fw-bold">{{ getNombreJuego(sesion.game_id) }}</td>
        <td class="text-light fw-bold">{{ sesion.puntos_ganados }}</td>
      </tr>
    </tbody>
  </table>

  <!-- Controles de paginación -->
  <div class="d-flex justify-content-center mt-4">
    <button class="btn btn-neon me-2" (click)="prevPage()" [disabled]="currentPage === 1">
      <i class="bi bi-arrow-left"></i> Anterior
    </button>
    <button class="btn btn-neon me-2" (click)="nextPage()" [disabled]="!hasMoreSesiones">
      Siguiente <i class="bi bi-arrow-right"></i>
    </button>
  </div>

  <div class="text-center mt-3">
    <br>
    <br>
    <span class="fw-bold fs-4 neon-text">Página {{ currentPage }}</span>
  </div>

  
</div>
