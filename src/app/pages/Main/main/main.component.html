<div class="container mt-5">
    <h1 class="text-center text-warning display-4 neon-text">🎲 FiguriBET 🎰</h1>
    <hr class="neon-hr">
  
    <div class="row justify-content-center">
      <!-- Usuarios -->
      <div class="col-md-4">
        <div class="card neon-card text-center">
          <div class="card-header">👤 Usuarios</div>
          <div class="card-body">
            <p class="card-text">Gestiona y visualiza los usuarios registrados.</p>
            <a [routerLink]="'/usuarios'" class="btn btn-neon">Ver Usuarios</a>
            <a [routerLink]="'/listado-usuarios'" class="btn btn-outline-neon">Listado</a>
          </div>
        </div>
      </div>
  
      <!-- Juegos -->
      <div class="col-md-4">
        <div class="card neon-card text-center">
          <div class="card-header">🎮 Juegos</div>
          <div class="card-body">
            <p class="card-text">Explora la lista de juegos disponibles.</p>
            <a [routerLink]="'/juegos'" class="btn btn-neon">Ver Juegos</a>
            <a [routerLink]="'/listado-juegos'" class="btn btn-outline-neon">Listado</a>
          </div>
        </div>
      </div>
  
      <!-- Sesiones -->
      <div class="col-md-4">
        <div class="card neon-card text-center">
          <div class="card-header">⏳ Sesiones</div>
          <div class="card-body">
            <p class="card-text">Consulta sesiones de juego activas y pasadas.</p>
            <a [routerLink]="'/sesiones'" class="btn btn-neon">Ver Sesiones</a>
            <a [routerLink]="'/listado-sesiones'" class="btn btn-outline-neon">Listado</a>
          </div>
        </div>
      </div>
    </div>
  
   
  </div>
